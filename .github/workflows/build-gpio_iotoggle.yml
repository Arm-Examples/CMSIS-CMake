name: Build GPIO_IOToggle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build B-U585I-IOT02A
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Activate vcpkg environment
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: vcpkg-configuration.json
          cache: cmsis-cmake

      # The default Arm license setup is for evaluation only.
      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build B-U585I-IOT02A
        working-directory: "."
        run: cbuild "GPIO_IOToggle.csolution.yml" --active "B-U585I-IOT02A" --packs

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpio-iotoggle-b-u585i-iot02a
          path: ./out
          if-no-files-found: warn
